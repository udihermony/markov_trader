services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: swing
      POSTGRES_PASSWORD: swing
      POSTGRES_DB: markov_trader
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swing -d markov_trader"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://swing:swing@postgres:5432/markov_trader
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-gaO00p7mU3YKkD25WbYhMTe3OXfJHAIDJC0MnKWm084=}
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://swing:swing@postgres:5432/markov_trader
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-gaO00p7mU3YKkD25WbYhMTe3OXfJHAIDJC0MnKWm084=}
    command: sh -c "alembic upgrade head && python -m backend.worker.main"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      # Browser-side — must be host-reachable, not the compose-internal
      # `api:8000` hostname.
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  pgdata:
