run:
  default_mode: paper
database:
  paper_path: swing_paper.db
  backtest_path: swing_backtest.db
screener:
  filters:
    Index: S&P 500
    Price: Over $20
    Average Volume: Over 500K
  top_n: 10
  retries: 3
  backoff_seconds: 2.0
  timeout_seconds: 30
data:
  fetch_window_days: 90
  min_history_days: 25
  refresh_last_bars: 1
  retries: 2
  backoff_seconds: 1.5
  benchmark_ticker: SPY
strategy:
  name: sma_crossover
  params:
    fast: 19
    slow: 20
    max_hold_days: 5
sizing:
  initial_cash: 100000.0
  cash_fraction: 0.1
  max_concurrent_positions: 8
  min_notional: 500.0
costs:
  slippage_bps: 5.0
