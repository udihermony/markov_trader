[project]
name = "markov-trader"
version = "0.1.0"
description = "Swing-trading practice environment — v2 backend"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "yfinance>=0.2.40",
    "finvizfinance>=1.0.0",
    "pandas>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
swing-agent = "backend.engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
